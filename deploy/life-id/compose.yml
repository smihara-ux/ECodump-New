services:
  eco-dump-web:
    image: nginx:1.27-alpine
    container_name: eco-dump-new
    restart: unless-stopped
    ports:
      - "100.83.235.95:8096:80"
    volumes:
      - ./current:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3

  eco-dump-demo-v1:
    image: nginx:1.27-alpine
    container_name: eco-dump-demo-v1
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:80"
    volumes:
      - ./releases/v1:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
